<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="50%" stop-color="#0E1320" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>

    <!-- Border highlight gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Top Chevron gradient -->
    <linearGradient id="topChevron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Bottom Chevron gradient -->
    <linearGradient id="bottomChevron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Core Diamond gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Ambient glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="72" y="72" width="368" height="368" rx="96" fill="#6366F1" opacity="0.25" filter="url(#glow)" />

  <!-- Outer Squircle Body -->
  <rect x="64" y="64" width="384" height="384" rx="92" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Inner Soft Accent Ring -->
  <rect x="80" y="80" width="352" height="352" rx="76" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.08" />

  <!-- Top Inward Compression Chevron -->
  <path d="M148 196 L256 264 L364 196" fill="none" stroke="url(#topChevron)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Inward Compression Chevron -->
  <path d="M148 316 L256 248 L364 316" fill="none" stroke="url(#bottomChevron)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Precision Core (Diamond Jewel) -->
  <polygon points="256,220 286,256 256,292 226,256" fill="url(#diamondGrad)" />

  <!-- Left / Right Framing Brackets -->
  <line x1="108" y1="232" x2="108" y2="280" stroke="#6366F1" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <line x1="404" y1="232" x2="404" y2="280" stroke="#06B6D4" stroke-width="12" stroke-linecap="round" opacity="0.8" />

  <!-- Precision Accent Dots -->
  <circle cx="256" cy="136" r="10" fill="#818CF8" />
  <circle cx="256" cy="376" r="10" fill="#34D399" />
</svg>
